[project]
name = "agentjam"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6.0.2,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/agentjam"]
[tool.pytest.ini_options]
pythonpath = ["src"]
